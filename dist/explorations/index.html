  <script src="/work/theme-init.js"></script>

<body>
  <main id="explorations" class="explorations-page">
    <header class="profile">
      <a class="profile-avatar" href="/" aria-label="Back to the homepage"><img src="/media/aditya-profile.jpg" width="32" height="32" alt="" /></a>
      <h1>Aditya Arya</h1>
      <p>Designing and building apps.</p>
      <nav class="section-nav" aria-label="Portfolio sections">
        <a href="/">Work</a>
        <a href="/explorations/" aria-current="page">Explorations</a>
        <a href="/work/catch/">Catch</a>
        <a href="/work/soja/">Soja</a>
      </nav>
    </header>
    <section class="explorations-feed" aria-label="Interfaces, websites and motion studies">
      <article class="exploration" data-title="Sailorfy" data-description="A calmer way to navigate the maritime world." data-destination="https://sailorfy.framer.website/" data-action="Live site">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Sailorfy preview"><img class="card-media" width="3840" height="2880" style="aspect-ratio:1920/1440" loading="lazy" decoding="async" src="/media/sailorfy-showcase-4k.webp" alt="Sailorfy website displayed in a desktop browser mockup" /></button>
      </article>
      <article class="exploration" data-title="Income slider" data-description="Exploring a sliding scale and rolling numbers." data-destination="" data-action="">
        <div class="motion-stage">
          <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Income slider preview"><video class="card-media" width="1080" height="1440" poster="/media/income-slider-iphone17pro.webp" data-src="/media/income-slider-iphone17pro.mp4" data-name="income slider animation" preload="none" muted loop playsinline disablepictureinpicture tabindex="-1" aria-hidden="true"></video></button>
          <button class="motion-toggle" type="button" aria-label="Play income slider animation preview" data-playing="false"><svg class="motion-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" fill="currentColor" /></svg><svg class="motion-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M17 5v14" stroke="currentColor" stroke-width="4" stroke-linecap="round" /></svg></button>
        </div>
      </article>
      <article class="exploration" data-title="Catch Live Board" data-description="Fast, legible Singapore bus arrivals designed for the moment you need them." data-destination="/work/catch/" data-action="Explore case study" data-case-study="/work/catch/">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Catch Live Board preview"><img class="card-media" width="3840" height="2880" style="aspect-ratio:1920/1440" loading="lazy" decoding="async" src="/media/catch-live-board-4k.webp" alt="Catch bus arrival board on an iPhone" /></button>
      </article>
      <article class="exploration" data-title="Soja Recovery" data-description="A personalised plan for rebuilding your body clock after disruption." data-destination="/work/soja/" data-action="Explore case study" data-case-study="/work/soja/">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Soja Recovery preview"><img class="card-media" width="3840" height="2880" style="aspect-ratio:1920/1440" loading="lazy" decoding="async" src="/media/soja-recovery-4k.webp" alt="Soja circadian recovery dashboard on an iPhone" /></button>
      </article>
      <article class="exploration" data-title="Catch Live Activity" data-description="The next bus, timing, and leave-now guidance at a glance." data-destination="/work/catch/" data-action="Explore case study" data-case-study="/work/catch/">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Catch Live Activity preview"><img class="card-media" width="3840" height="2880" style="aspect-ratio:1920/1440" loading="lazy" decoding="async" src="/media/catch-live-detail-4k.webp" alt="Catch Live Activity showing the next bus and leave-now guidance" /></button>
      </article>
      <article class="exploration" data-title="Soja Website" data-description="The product story and science behind personalised sleep recovery." data-destination="/work/soja/" data-action="Explore case study" data-case-study="/work/soja/">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Soja Website preview"><img class="card-media" width="3840" height="2487" style="aspect-ratio:1541/998" loading="lazy" decoding="async" src="/media/soja-website-4k.webp" alt="Soja website with a landscape and the message Reset your sleep" /></button>
      </article>
      <article class="exploration" data-title="Catch Nearby" data-description="Nearby stops and arrivals placed directly on the map." data-destination="/work/catch/" data-action="Explore case study" data-case-study="/work/catch/">
        <button class="preview-open" type="button" aria-haspopup="dialog" aria-label="Open Catch Nearby preview"><img class="card-media" width="3840" height="2880" style="aspect-ratio:1920/1440" loading="lazy" decoding="async" src="/media/catch-map-4k.webp" alt="Catch nearby bus stops map on an iPhone" /></button>
      </article>
    </section>
    <footer class="explorations-footer"><a href="/">Back to work</a><button type="button" id="appearance">Dark appearance</button></footer>
  </main>
  <dialog class="modal-panel" id="media-viewer" aria-labelledby="modal-title" aria-describedby="modal-description">
    <div class="viewer-stage"><img id="modal-image" alt="" hidden /><video id="modal-video" controls muted loop playsinline hidden aria-label="Animation playback"></video></div>
    <div class="modal-details">
      <span class="modal-copy"><strong id="modal-title"></strong><span id="modal-description"></span></span>
      <span class="modal-actions"><a class="modal-link" data-liquid-glass id="modal-link" href="#" hidden></a><button class="modal-close" data-liquid-glass type="button" aria-label="Close project preview"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg></button></span>
    </div>
  </dialog>

</html>
